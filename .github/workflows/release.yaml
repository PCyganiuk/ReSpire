name: Build and Release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout
      # ------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Read version from pubspec.yaml
      # ------------------------------------------------------

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not find version in pubspec.yaml"
            exit 1
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Detected version: $VERSION"

      # ------------------------------------------------------
      # Determine release type
      # ------------------------------------------------------

      - name: Determine tag name
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "TAG_NAME=v${APP_VERSION}" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            echo "TAG_NAME=v${APP_VERSION}-rc" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "ERROR: Unsupported branch"
            exit 1
          fi

      # ------------------------------------------------------
      # Create and push Git tag
      # ------------------------------------------------------

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG_NAME already exists."
            exit 1
          fi

          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      # ------------------------------------------------------
      # Java
      # ------------------------------------------------------

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: gradle

      # ------------------------------------------------------
      # Flutter
      # ------------------------------------------------------

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ------------------------------------------------------
      # Flutter dependencies
      # ------------------------------------------------------

      - name: Get dependencies
        run: flutter pub get

      # ------------------------------------------------------
      # Restore release keystore
      # ------------------------------------------------------

      - name: Restore release keystore
        env:
          RESPIRE_KEYSTORE_BASE64: ${{ secrets.RESPIRE_KEYSTORE_BASE64 }}
        run: |
          echo "$RESPIRE_KEYSTORE_BASE64" | base64 --decode > android/respire-release.jks

      # ------------------------------------------------------
      # Create key.properties
      # ------------------------------------------------------

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=respire-release.jks
          EOF

      # ------------------------------------------------------
      # Build release APK
      # ------------------------------------------------------

      - name: Build APK
        run: |
          flutter build apk --release

      # ------------------------------------------------------
      # Rename APK
      # ------------------------------------------------------

      - name: Rename APK
        run: |
          mv \
            build/app/outputs/flutter-apk/app-release.apk \
            "ReSpire-${TAG_NAME}.apk"

      # ------------------------------------------------------
      # Show APK information
      # ------------------------------------------------------

      - name: Show APK information
        run: |
          ls -lh "ReSpire-${TAG_NAME}.apk"

      # ------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: ReSpire-${{ env.TAG_NAME }}.apk
          prerelease: ${{ env.IS_PRERELEASE }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}