name: Build and Release

on:
  push:
    branches:
      - main
      - dev
      - 1.9.x-mic-monitor

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Determine Build Configuration
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "FLAVOR=production" >> $GITHUB_ENV
            echo "TAG_NAME=v${{ env.APP_VERSION }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "FLAVOR=experimental" >> $GITHUB_ENV
            echo "TAG_NAME=v${{ env.APP_VERSION }}-rc" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "FLAVOR=experimental" >> $GITHUB_ENV
            echo "TAG_NAME=v${{ env.APP_VERSION }}-${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

          echo "Flavor: $FLAVOR"
          echo "Tag: $TAG_NAME"

      - name: Create and Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Error: Tag $TAG_NAME already exists."
            exit 1
          else
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --flavor ${{ env.FLAVOR }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-${{ env.FLAVOR }}-release.apk \
             ReSpire-${{ env.TAG_NAME }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: ReSpire-${{ env.TAG_NAME }}.apk
          prerelease: ${{ env.IS_PRERELEASE }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}